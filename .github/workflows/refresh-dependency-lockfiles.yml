name: Refresh dependency lockfiles

on:
  push:
    branches:
      - codex/security-hardening

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[lockfiles-refreshed]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            backend/package-lock.json

      - name: Refresh client lockfile
        working-directory: client
        run: npm install --package-lock-only --ignore-scripts

      - name: Refresh backend lockfile
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts

      - name: Remove duplicate pnpm lockfile
        run: git rm -f client/pnpm-lock.yaml

      - name: Commit refreshed dependency locks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/package-lock.json backend/package-lock.json
          git commit -m "[lockfiles-refreshed] Refresh dependency lockfiles" || exit 0
          git push
