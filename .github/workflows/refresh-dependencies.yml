name: Refresh dependency lockfile

on:
  push:
    branches: [codex/security-hardening]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-client-lockfile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/security-hardening

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify patched dependency versions
        run: |
          node -e "const p=require('./package-lock.json'); const pk=p.packages; const checks={'node_modules/next':'15.5.21','node_modules/lodash':'4.18.0','node_modules/glob':'10.5.0','node_modules/nanoid':'5.1.16'}; for (const [name,want] of Object.entries(checks)) { if (!pk[name] || pk[name].version !== want) { console.error(name+'='+((pk[name]||{}).version||'missing')+', expected '+want); process.exit(1); } }"

      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current"
          else
            git commit -m "security: refresh client lockfile with patched dependencies"
            git push
          fi
